<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<title>策略实时监控</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f4f6fa;color:#1e293b;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
.hd{background:linear-gradient(135deg,#1e293b 0%,#0f172a 55%,#172554 100%);color:#e2e8f0;
  padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
.hd h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.hd .live{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;
  color:#94a3b8;margin-left:auto}
.hd .dot{width:6px;height:6px;border-radius:50%;background:#475569}
.hd .dot.on{background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.22);animation:bl 2s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.4}}
.hd .row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.hd .pill{font-size:12px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.12);color:#cbd5e1;white-space:nowrap}
.hd .pill b{color:#fff;font-weight:700}
.hd .sub{margin-top:7px;font-size:11.5px;color:#64748b}
/* 链路自检：一行回答「今天系统到底跑没跑」。不通过就把失败的那步点名。 */
.hd .chk{margin-top:8px;font-size:11px;line-height:1.6;padding:4px 9px;border-radius:7px;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#cbd5e1}
.hd .chk.ok{border-color:rgba(52,211,153,.35);color:#6ee7b7;background:rgba(52,211,153,.10)}
.hd .chk.bad{border-color:rgba(248,113,113,.4);color:#fca5a5;background:rgba(248,113,113,.10)}
/* ---------- 今日怎么做（首屏英雄卡） ----------
   信息层级：先给「做什么」，再给「为什么」。以前要先展开持仓卡才看得到，
   等于没有。颜色按方向：卖出=红（要动手），买入=琥珀，不动=白。 */
.hero{border-radius:15px;padding:14px 15px;margin-bottom:12px;border:1px solid #e4e9f0;
  background:#fff;box-shadow:0 2px 6px rgba(16,24,40,.06)}
.hero.must{background:linear-gradient(180deg,#fff1f2,#fff 70%);border-color:#fecdd3}
.hero.buy{background:linear-gradient(180deg,#fffbeb,#fff 70%);border-color:#fde68a}
.hero-k{font-size:11px;letter-spacing:.6px;color:#9f1239;font-weight:750}
.hero.none .hero-k,.hero.buy .hero-k{color:#94a3b8}
.hero-t{font-size:19px;font-weight:800;color:#881337;margin:5px 0 7px;letter-spacing:-.3px;line-height:1.3}
.hero.buy .hero-t{color:#92400e}
.hero.none .hero-t{color:#334155;font-size:17px}
.hero-p{font-size:13.5px;font-weight:700;color:#334155;line-height:1.6;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
.hero-w{font-size:11.5px;color:#64748b;line-height:1.75;margin-top:5px}
.hero details{margin-top:8px;border-top:1px dashed #e2e8f0;padding-top:7px}
.hero summary{font-size:11.5px;color:#4f46e5;cursor:pointer;font-weight:650}
.hero .hw{font-size:11.5px;color:#475569;line-height:1.8;margin-top:5px}
/* 每条策略一行：线C 是你要执行的，平台三条是别人在跑的，必须分开看 */
.hero .acts{margin-top:5px}
.hero .arow{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed #f1f5f9}
.hero .arow:last-child{border-bottom:0}
.hero .an{flex:0 0 44px;color:#94a3b8;font-weight:700;font-size:11.5px}
.hero .ac{flex:0 0 30px;font-weight:800;font-size:11px;padding:1px 3px;border-radius:4px;text-align:center}
.hero .ac.buy,.hero .ac.sell{background:#fef2f2;color:#b91c1c}
.hero .ac.hold{background:#f1f5f9;color:#475569}
.hero .ac.empty,.hero .ac.none{background:#f8fafc;color:#94a3b8}
.hero .ap{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:#334155;font-weight:650;font-size:12px}
.hero .al{flex:0 0 auto;color:#94a3b8;font-size:10.5px;max-width:120px;text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 分组标签：把「持仓 / 环境 / 情报」三段分开，减少“一屏到底”的压迫感 */
.grp{display:flex;align-items:center;gap:9px;margin:15px 2px 8px;
  font-size:11px;letter-spacing:1.3px;color:#94a3b8;font-weight:750}
.grp::after{content:'';flex:1;height:1px;background:#eef2f7}
/* ---------- 顶部锚点导航：一条滚动条走到底，靠它跳 ---------- */
.hd .hubnav{margin-top:9px;display:flex;gap:8px;align-items:center}
.hd .hubnav .rbtn{flex:0 0 auto;font-size:12px;font-weight:650;padding:5px 10px;border-radius:7px;
  background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.18);color:#dbeafe;
  cursor:pointer;white-space:nowrap}
.hd .hubnav .rbtn:disabled{opacity:.55}
.hd .hubnav .hint{font-size:11px;color:#64748b;margin-left:auto}
.navx{position:sticky;top:0;z-index:40;background:rgba(244,246,250,.97);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-bottom:1px solid #e8edf4;padding:7px 12px;display:flex;gap:6px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.navx::-webkit-scrollbar{display:none}
.navx a{flex:0 0 auto;font-size:11.5px;font-weight:650;color:#475569;background:#fff;
  border:1px solid #e4e9f0;border-radius:20px;padding:4px 10px;text-decoration:none;white-space:nowrap}
html{scroll-behavior:smooth}
.wrap>[id]{scroll-margin-top:46px}

/* ---------- 决策链：四步单向因果 ---------- */
.chn{background:#fff;border:1px solid #e4e9f0;border-radius:14px;padding:13px;margin-bottom:10px}
.chn-h{font-size:13px;font-weight:750;color:#0f172a;display:flex;align-items:center;gap:6px}
.chn-h .rt{margin-left:auto;font-size:10.5px;color:#94a3b8;font-weight:600}
.chn .tag{font-size:10px;padding:1px 5px;border-radius:4px;background:#eff6ff;color:#4338ca;font-weight:700}
.chn-s{font-size:10.5px;color:#94a3b8;margin-top:4px;line-height:1.7}
.chn-l{margin-top:11px;position:relative;padding-left:23px}
.chn-l::before{content:'';position:absolute;left:7px;top:5px;bottom:16px;width:2px;background:#eef2f7}
.chn-i{position:relative;padding-bottom:13px}
.chn-i:last-child{padding-bottom:0}
.chn-i::before{content:attr(data-n);position:absolute;left:-23px;top:0;width:16px;height:16px;
  border-radius:50%;background:#fff;border:2px solid #cbd5e1;color:#94a3b8;font-size:9.5px;
  font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}
.chn-i.bear::before{border-color:#059669;color:#059669}
.chn-i.B::before{border-color:#4f46e5;color:#4f46e5}
.chn-i.fit::before{border-color:#4f46e5;color:#4f46e5}
.chn-i.act::before{border-color:#b91c1c;color:#b91c1c}
.chn-k{font-size:10px;color:#94a3b8;letter-spacing:.7px;font-weight:750}
.chn-v{font-size:14px;font-weight:750;color:#0f172a;margin-top:2px;line-height:1.4}
.chn-u{font-size:10.5px;color:#94a3b8;margin-top:2px;line-height:1.6}
.chn-w{font-size:10.5px;color:#64748b;margin-top:3px;line-height:1.8;word-break:break-word}
.chn-note{font-size:10.5px;color:#64748b;background:#f8fafc;border-radius:8px;padding:8px 10px;
  margin-top:10px;line-height:1.9}

/* ---------- 环境矩阵 ---------- */
.mx{background:#fff;border:1px solid #e4e9f0;border-radius:14px;padding:13px;margin-bottom:10px}
.mx-h{font-size:13px;font-weight:750;color:#0f172a;display:flex;align-items:center;gap:6px}
.mx-h .rt{margin-left:auto;font-size:10.5px;color:#94a3b8;font-weight:600}
.mx-h .tag{font-size:10px;padding:1px 5px;border-radius:4px;background:#f5f3ff;color:#4f46e5;font-weight:700}
.mx table{width:100%;border-collapse:collapse;margin-top:9px;table-layout:fixed}
.mx th{font-size:10px;font-weight:750;color:#94a3b8;padding:3px 0 4px;text-align:center;
  border-bottom:1px solid #eef2f7;line-height:1.2}
.mx th:first-child{text-align:left;width:74px}
.mx th.on{color:#4338ca;background:#eff6ff;border-radius:5px 5px 0 0}
.mx th i{display:block;font-size:8.5px;color:#cbd5e1;font-style:normal;font-weight:600;margin-top:1px}
.mx td{padding:2px 0;text-align:center;border-bottom:1px solid #f6f8fb;font-size:11px;
  font-variant-numeric:tabular-nums}
.mx td:first-child{text-align:left;font-size:11px;font-weight:650;color:#334155;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:3px}
.mx td b{display:block;font-size:11px;line-height:1.35;font-weight:750}
.mx td i{display:block;font-size:8.5px;line-height:1.3;font-style:normal;color:#94a3b8;font-weight:600}
.mx-lg{display:flex;flex-wrap:wrap;gap:4px 9px;margin-top:9px;font-size:9.5px;color:#94a3b8;line-height:1.6}
.mx-lg .on{color:#4338ca;font-weight:700}
.mx-note{font-size:10px;color:#94a3b8;margin-top:7px;line-height:1.8}

/* ---------- 折叠区（健康 / 评分标准 / 口径） ---------- */
.acc{background:#fff;border:1px solid #e4e9f0;border-radius:14px;margin-bottom:10px;overflow:hidden}
.acc>summary{list-style:none;cursor:pointer;padding:12px 13px;font-size:12.5px;font-weight:750;
  color:#334155;display:flex;align-items:center;gap:7px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:'展开';margin-left:auto;font-size:10.5px;color:#94a3b8;font-weight:600}
.acc[open]>summary::after{content:'收起'}
.acc>summary .tag{font-size:10px;padding:1px 5px;border-radius:4px;background:#f1f5f9;
  color:#475569;font-weight:700}
.acc>summary .tag.bad{background:#fef2f2;color:#b91c1c}
.acc>summary .tag.ok{background:#ecfdf5;color:#047857}
.acc .bd{padding:2px 13px 12px;border-top:1px dashed #eef2f7}
.hl{display:flex;gap:7px;padding:6px 0;border-bottom:1px solid #f6f8fb;font-size:10.5px;line-height:1.8}
.hl:last-child{border-bottom:0}
.hl .d{flex:0 0 6px;height:6px;border-radius:50%;margin-top:6px;background:#34d399}
.hl.warn .d{background:#f59e0b}
.hl.bad .d{background:#ef4444}
.hl .k{flex:0 0 84px;color:#475569;font-weight:750}
.hl .v{flex:1 1 auto;min-width:0;color:#64748b;word-break:break-word}
.rl{padding:9px 0;border-bottom:1px solid #f6f8fb}
.rl:last-child{border-bottom:0}
.rl .t{font-size:12px;font-weight:750;color:#334155;display:flex;gap:6px;align-items:baseline}
.rl .w{font-size:9.5px;color:#4338ca;background:#eff6ff;padding:1px 4px;border-radius:4px;font-weight:750}
.rl .h{font-size:10.5px;color:#64748b;margin-top:3px;line-height:1.85}
.rl .c{font-size:9.5px;color:#94a3b8;margin-top:2px;font-family:ui-monospace,Menlo,monospace;
  line-height:1.75;word-break:break-word}
.cb{padding:7px 0;border-bottom:1px solid #f6f8fb;font-size:10.5px}
.cb:last-child{border-bottom:0}
.cb .k{font-weight:700;color:#475569}
.cb .c{color:#94a3b8;font-family:ui-monospace,Menlo,monospace;font-size:9.5px;margin-top:2px;
  line-height:1.7;word-break:break-word}
.fb{font-size:10px;color:#b91c1c;background:#fef2f2;border-radius:8px;padding:9px 11px;
  line-height:1.9;margin-top:9px}
.fb b{display:block;margin-bottom:3px;font-size:10.5px}
.fb ul{margin:0;padding-left:14px}
.fb li{margin:3px 0}
code{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;background:#f1f5f9;
  padding:1px 3px;border-radius:3px;color:#475569}

/* 宽屏（桌面打开同一个文件）：两个两列布局，不用再另开一个页面 */
@media(min-width:820px){
  .wrap{max-width:900px}
  .chn,.mx{max-width:none}
}

.wrap{padding:12px 12px 24px;max-width:560px;margin:0 auto}

/* ---------- 当前环境与策略适配（页面第一块：先答「现在什么天气、该用谁」） ---------- */
.wx{background:#fff;border:1px solid #e4e9f0;border-radius:14px;padding:13px 14px;margin-bottom:10px}
.wx-h{display:flex;gap:11px;align-items:flex-start}
.wx-badge{flex:0 0 42px;height:42px;border-radius:12px;color:#fff;font-size:22px;font-weight:800;
  display:flex;align-items:center;justify-content:center;letter-spacing:-.5px;
  background:linear-gradient(135deg,#1e40af,#3b82f6);box-shadow:0 3px 10px rgba(37,99,235,.28)}
.wx-badge.bearish{background:linear-gradient(135deg,#065f46,#059669);box-shadow:0 3px 10px rgba(5,150,105,.26)}
.wx-badge.crisis{background:linear-gradient(135deg,#7f1d1d,#dc2626);box-shadow:0 3px 10px rgba(220,38,38,.26)}
.wx-t{font-size:15px;font-weight:750;color:#0f172a;line-height:1.35}
.wx-s{font-size:11.5px;color:#94a3b8;margin-top:4px;line-height:1.65}
.wx-mkt{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.wx-mkt span{font-size:11px;padding:3px 7px;border-radius:6px;background:#f1f5f9;color:#475569;white-space:nowrap}
.wx-mkt span.b{background:#eff6ff;color:#4338ca;font-weight:650}
.wx-q{display:flex;align-items:baseline;gap:6px;font-size:12px;color:#94a3b8;
  margin:13px 0 7px;letter-spacing:.3px;border-top:1px dashed #eef2f7;padding-top:10px}
.wx-q b{color:#475569;font-weight:650;font-size:12px}
.wx-tb{width:100%;border-collapse:collapse;font-size:12px}
.wx-tb td{padding:5px 4px;border-bottom:1px solid #f6f8fb;vertical-align:middle}
.wx-tb tr:last-child td{border-bottom:none}
.wx-tb .rk{width:16px;color:#cbd5e1;font-weight:800;font-variant-numeric:tabular-nums;text-align:center}
.wx-tb tr.top1 .rk{color:#4338ca}
.wx-tb .nm{color:#334155;font-weight:600;line-height:1.3}
.wx-tb .nm .n1{display:block;font-weight:650;line-height:1.35}
.wx-tb .nm .tg{display:block;margin-top:3px;line-height:1.5}
.wx-tb .nm .tg .wx-tag{margin-left:0;margin-right:4px}
.wx-tb .nm i{display:block;font-size:10.5px;color:#94a3b8;font-style:normal;font-weight:400;margin-top:1px}
.wx-tb .bp{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;width:62px}
.wx-tb .bp i{display:block;font-size:10px;color:#94a3b8;font-weight:400;font-style:normal;margin-top:1px}
.wx-tb .sc{text-align:right;font-variant-numeric:tabular-nums;color:#64748b;width:46px;font-size:12px}
.wx-tb .sc b{color:#0f172a;font-weight:700}
.wx-tb tr.dim td{opacity:.62}
.wx-tb tr.clickable{cursor:pointer}
.wx-tb tr.clickable:hover{background:#f8fbff}
.wx-tb tr.det td{padding:9px 5px 11px;background:#fafbfd;border-bottom:1px solid #eef2f7}
.nd{margin-bottom:8px}
.nd:last-child{margin-bottom:0}
.nd .h{display:flex;justify-content:space-between;font-size:11px;color:#475569;font-weight:650}
.nd .h b{color:#0f172a;font-variant-numeric:tabular-nums}
.nd .b{height:3px;background:#eef2f7;border-radius:2px;margin:3px 0;overflow:hidden}
.nd .b i{display:block;height:100%;border-radius:2px}
.nd .n{font-size:10.5px;color:#94a3b8;line-height:1.6}
.wx-tag{font-size:10px;padding:1px 4px;border-radius:4px;background:#eff6ff;color:#4338ca;
  border:1px solid #dbeafe;margin-left:4px;font-weight:600;white-space:nowrap}
.wx-tag.empty{background:#f8fafc;color:#94a3b8;border-color:#eef2f7}
.wx-tag.sell{background:#fef2f2;color:#b91c1c;border-color:#fecaca;font-weight:700}
.wx-tag.warn{background:#fffbeb;color:#b54708;border-color:#fde68a;font-weight:700}
.wx-note{font-size:11px;color:#94a3b8;line-height:1.7;margin-top:9px;
  border-top:1px dashed #eef2f7;padding-top:8px}
.wx-note b{color:#64748b}
.wx-v{font-size:11.5px;color:#475569;line-height:1.75;background:#f8fafc;border:1px solid #eef2f7;
  border-radius:8px;padding:8px 10px;margin-top:9px}
.wx-v b{color:#0f172a;font-weight:700}
.wx-v .bad{color:#b54708}
.wx-dt{font-size:11px;color:#64748b;cursor:pointer;user-select:none;margin:8px 14px 0 0;display:inline-block}
.wx-dt:hover{color:#4338ca}
.wx-dim{display:none;margin-top:8px}
.wx-dim.on{display:block}
.wx-dim .r{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 0}
.wx-dim .r .k{flex:0 0 96px;color:#64748b}
.wx-dim .r .bar{flex:1;height:5px;border-radius:2px;background:#eef2f7;position:relative;overflow:hidden}
.wx-dim .r .bar::before{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;
  background:#cbd5e1;z-index:2}
.wx-dim .r .bar i{position:absolute;top:0;bottom:0;border-radius:2px}
.wx-dim .r .v{flex:0 0 42px;text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.wx-cond{display:none;margin-top:8px}
.wx-cond.on{display:block}
.wx-cond .c{display:flex;gap:7px;font-size:11.5px;padding:5px 0;border-bottom:1px solid #f6f8fb;align-items:flex-start}
.wx-cond .c:last-child{border-bottom:none}
.wx-cond .c .hit{flex:0 0 13px;font-weight:800;text-align:center}
.wx-cond .c .txt{flex:1;line-height:1.55}
.wx-cond .c .txt b{font-weight:650;color:#334155}
.wx-cond .c .txt i{display:block;font-size:10.5px;color:#94a3b8;font-style:normal;margin-top:1px}
.wx-cond .c .txt em{display:block;font-size:11px;color:#475569;font-style:normal;margin-top:2px;
  line-height:1.55;background:#f8fafc;border-left:2px solid #dbeafe;padding:2px 0 2px 6px}
.wx-cond .c.part .hit{color:#d97706!important}
.wx-cond .c.part .txt em{border-left-color:#fbbf24;background:#fffbeb;color:#78350f}
.wx-dim .why{font-size:10.5px;color:#64748b;padding:0 0 4px 102px;margin-top:-1px;line-height:1.6}
/* 口径之外：四维只看「水平」，不看「单日强度 / 趋势」，这层单列出来 */
.wx-ex{margin-top:9px;background:#f8fafc;border:1px solid #eef2f7;border-radius:9px;padding:8px 10px}
.wx-ex b{display:block;font-size:11px;color:#475569;font-weight:700;margin-bottom:5px;letter-spacing:.2px}
.wx-ex div{font-size:11px;color:#64748b;line-height:1.7;padding:1px 0}
.wx-ex div i{font-style:normal;color:#0f172a;font-weight:650;font-variant-numeric:tabular-nums}
.wx-ex div.warnx{color:#b54708}
/* 统一账本：四条策略同一口径，回答「最近谁赚得多」 */
.bk{background:#fff;border:1px solid #e4e9f0;border-radius:14px;padding:12px 13px;margin-bottom:10px}
.bk-h{display:flex;align-items:baseline;gap:6px;margin-bottom:9px}
.bk-h b{font-size:13.5px;color:#0f172a;font-weight:750}
.bk-h span{font-size:11px;color:#94a3b8}
.bk-h .r{margin-left:auto;font-size:10.5px;color:#94a3b8}
.bkr{border-top:1px solid #f4f7fb;cursor:pointer}
.bkr:first-of-type{border-top:none}
.bkr:hover{background:#fafcff}
.bkr .m{display:flex;align-items:center;gap:7px;padding:8px 2px}
.bkr .no{width:15px;font-size:11px;color:#cbd5e1;font-weight:800;text-align:center}
.bkr:first-of-type .no{color:#4338ca}
.bkr .nm{flex:1;min-width:0}

<script>
/* ===== 实时内核：与主看台 hub/index.html 内联同一份 live_core.js =====
   判定只写一处 ⇒ 「距止损多少 / 是否已破 / 限价成不成立」两页算出来必然一致 */
/* ============================================================================
   live_core.js —— 策略中枢实时内核（主看台 hub/index.html 与手机页 live/index.html 共用）
   ----------------------------------------------------------------------------
   为什么要有这个文件
   ------------------
   在 v6 之前，两个页面各写各的：
     主看台：只有起 serve.py 才有实时价，file:// 打开直接显示「无实时行情」；
             而且只显示价格，不判断「按规则现在该不该动手」。
     手机页：直连东财有实时价，但也只画价格，不知道线C 的四道闸门、96864 的双 5%。
   ⇒ 同一个持仓，两个屏幕可能给出不同的隐含结论。11-20 那笔止损漏执行就是这个形态：
     看板写「距止损 +4.11%」，手机页写「现价 0.362」，没人把两件事算在一起。

   所以本文件是「判定只写一处」的实现：任何页面的判定都调 LC.judge()，
   改规则只改这一个文件，两边同时生效。构建时内联，不产生额外请求。
   ============================================================================ */
const LC = (function () {
  'use strict';

  /* ---------- 1. 标的 → 东财 secid（5/6 开头沪市，其余深市） ---------- */
  function SECID(c) { return (/^[56]/.test(c) ? '1.' : '0.') + c; }

  function hhmmss() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  /* ---------- 2. 行情：双源冗余 ----------
     为什么不是单源：2026-11-22 实测东方财富 push2 在被高频请求后会直接掐连接
     （ERR_EMPTY_RESPONSE，四个域名同时失效），不是 429 限流，重试也没用。
     而腾讯 qt.gtimg.cn 同样返回 Access-Control-Allow-Origin: *
     ⇒ 两个都是浏览器可直连的源，做冗余才敢说「随时能打开」。
       ① 东财 push2：批量、字段全（含最高最低），优先
       ② 腾讯 qt   ：兜底，字段少但够判止损
     */

  /* 东财：f1=小数位 f2=价 f3=涨跌幅×100 f12=代码 f14=名称 f15=最高 f16=最低 f18=昨收 */
  async function fetchEM(codes) {
    const arr = [...new Set((codes || []).filter(Boolean))];
    if (!arr.length) return {};
    const url = 'https://push2.eastmoney.com/api/qt/ulist.np/get?secids='
      + arr.map(SECID).join(',')
      + '&fields=f1,f2,f3,f12,f13,f14,f15,f16,f18&_=' + Date.now();
    const r = await fetch(url, { cache: 'no-store' });
    const j = await r.json();
    const out = {};
    ((j.data && j.data.diff) || []).forEach(function (d) {
      const dec = Math.pow(10, d.f1 == null ? 2 : d.f1);
      out[String(d.f12)] = {
        price: d.f2 == null ? null : d.f2 / dec,
        chg: d.f3 == null ? null : d.f3 / 100,
        high: d.f15 == null ? null : d.f15 / dec,
        low: d.f16 == null ? null : d.f16 / dec,
        pre: d.f18 == null ? null : d.f18 / dec,
        name: d.f14,
        src: 'em'
      };
    });
    return out;
  }

  /* 腾讯：~ 分隔，[1]=名称 [2]=代码 [3]=现价 [4]=昨收 [31]=涨跌额 [32]=涨跌幅% [33]=最高 [34]=最低 */
  function TXID(c) { return (/^[56]/.test(c) ? 'sh' : 'sz') + c; }
  async function fetchTX(codes) {
    const arr = [...new Set((codes || []).filter(Boolean))];
    if (!arr.length) return {};
    const url = 'https://qt.gtimg.cn/q=' + arr.map(TXID).join(',') + '&_=' + Date.now();
    const r = await fetch(url, { cache: 'no-store' });
    const buf = await r.arrayBuffer();
    /* 返回是 GBK，浏览器不会自动按 GBK 解，必须手动 decode */
    const txt = new TextDecoder('gbk').decode(buf);
    const out = {};
    txt.split(';').forEach(function (line) {
      line = line.trim();
      if (line.indexOf('="') < 0) return;
      const f = line.split('="')[1].replace(/"$/, '').split('~');
      if (f.length < 35) return;
      const code = f[2];
      const price = parseFloat(f[3]);
      if (!isFinite(price)) return;
      out[code] = {
        price: price,
        chg: parseFloat(f[32]),
        high: parseFloat(f[33]),
        low: parseFloat(f[34]),
        pre: parseFloat(f[4]),
        name: f[1],
        src: 'tx'
      };
    });
    return out;
  }

  function withTimeout(p, ms) {
    return Promise.race([
      p,
      new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, ms); })
    ]);
  }

  /* 双源取价：返回 {data:{code:{...}}, src:'em'|'tx'|''}
     源挂了记 5 分钟，避免每轮都撞同一个墙（浏览器控制台也不会刷满红字） */
  let emDownUntil = 0;
  async function fetchQuote(codes) {
    if (Date.now() > emDownUntil) {
      try {
        const d = await withTimeout(fetchEM(codes), 6000);
        if (d && Object.keys(d).length) return { data: d, src: 'em' };
        emDownUntil = Date.now() + 300000;
      } catch (e) {
        emDownUntil = Date.now() + 300000;
      }
    }
    try {
      const d = await withTimeout(fetchTX(codes), 6000);
      if (d && Object.keys(d).length) return { data: d, src: 'tx' };
    } catch (e) { /* 双源都失败 */ }
    return { data: {}, src: '' };
  }

  /* ---------- 3. 各策略的风控口径（与后端 config 对应，改这里要同步改 config） ----------
     注意：real_positions 里的 stop 已经是后端算好的「较紧那条」，
     本表只用于补 target 与文案，不用来重算 stop。 */
  const RULES = {
    lineC:     { stopPct: -15, targetPct: 3,  note: '四道闸门：−15% 深套 / 回本且 20 日乖离≥0 / +3% 目标 / 满 30 日' },
    bank96864: { stopPct: -5,  targetPct: null, note: '双 5% 止损：跌幅 5% / 高点回撤 5%（页面显示较紧那条）' },
    band96863: { stopPct: null, targetPct: null, note: '无止损，靠 19 日区间涨幅 2~10% 带内换仓' },
    momo96865: { stopPct: null, targetPct: null, note: '无止损，靠 20/26 加权斜率双滤换仓' },
    momo94744: { stopPct: null, targetPct: null, note: 'momo + 溢价率 >30% 即卖（躲停牌）' },
    hengfang:  { stopPct: null, targetPct: null, note: '只发信号不下单，无仓位管理' }
  };

  /* ---------- 4. 统一判定：给一个价，返回「该不该动手」 ----------
     it 需要：{code, cost, stop, snap_dist, snap_pnl, sid, target}
     返回：{price, pnl, dist, gate, txt, flip, hot}
       gate  stop 已破止损 / watch 逼近(<2%) / near 距 5% 内 / ok 安全 / na 无止损
       flip  broke 快照没破、实时破了（最危险，必须立刻处理）
             recovered 快照破、实时收回（可以不补做） */
  function judge(it, price) {
    const o = { code: it.code, price: price, pnl: null, dist: null, gate: 'na', txt: '无止损', flip: null, hot: false };
    if (price == null || !isFinite(price)) return o;

    if (it.cost) o.pnl = (price / it.cost - 1) * 100;

    if (it.stop) {
      o.dist = (price / it.stop - 1) * 100;
      if (o.dist < 0)            { o.gate = 'stop';  o.txt = '已破止损'; }
      else if (o.dist < 2)       { o.gate = 'watch'; o.txt = '逼近止损'; }
      else if (o.dist < 5)       { o.gate = 'near';  o.txt = '距 5% 内'; }
      else                       { o.gate = 'ok';    o.txt = '安全'; }

      if (it.snap_dist != null && isFinite(it.snap_dist)) {
        if (it.snap_dist >= 0 && o.dist < 0)      o.flip = 'broke';
        else if (it.snap_dist < 0 && o.dist >= 0) o.flip = 'recovered';
      }
      o.hot = (o.gate === 'stop');
    } else if (it.cost) {
      /* 无止损价但有成本：用规则表里的 stopPct 兜底 */
      const r = RULES[it.sid] || {};
      if (r.stopPct) {
        o.dist = o.pnl - r.stopPct;      /* 距止损的百分点距离 */
        if (o.dist < 0)      { o.gate = 'stop';  o.txt = '已破 ' + r.stopPct + '%'; }
        else if (o.dist < 2) { o.gate = 'watch'; o.txt = '逼近 ' + r.stopPct + '%'; }
        else                 { o.gate = 'ok';    o.txt = '安全'; }
        o.hot = (o.gate === 'stop');
      } else {
        o.gate = 'na'; o.txt = '无止损';
      }
    }
    return o;
  }

  /* ---------- 5. 目标价（线C +3% 止盈，其它策略没有） ---------- */
  function targetOf(it) {
    const r = RULES[it.sid] || {};
    if (it.target != null) return it.target;
    if (r.targetPct != null && it.cost) return it.cost * (1 + r.targetPct / 100);
    return null;
  }

  /* ---------- 6. 交叉校验：实时状态 vs 快照状态 ----------
     返回给人看的告警项。这是「联动」的核心：
     看板说没事、行情说有事 —— 必须当场说清，而不是等收盘再对账。 */
  function crosscheck(items, live, snapDate) {
    const out = [];
    (items || []).forEach(function (it) {
      const q = live[it.code];
      if (!q || q.price == null) return;
      const j = judge(it, q.price);
      const nm = (it.s || '') + ' ' + (it.code || '');
      if (j.flip === 'broke') {
        out.push({
          kind: 'bad', code: it.code,
          txt: nm + '：现价 <b>' + fx(q.price, 3) + '</b> 已跌破止损 <b>' + fx(it.stop, 4)
             + '</b>（' + sg(j.dist) + '）。数据日 ' + (snapDate || '—')
             + ' 记录为 ' + sg(it.snap_dist) + ' ⇒ <b>按规则现在就该卖</b>'
        });
      } else if (j.flip === 'recovered') {
        out.push({
          kind: 'ok', code: it.code,
          txt: nm + '：现价 ' + fx(q.price, 3) + ' 已收回止损线上方（' + sg(j.dist)
             + '）。数据日的补做止损可暂缓，等收盘再判'
        });
      } else if (j.gate === 'watch' && (it.snap_dist == null || it.snap_dist >= 2)) {
        out.push({
          kind: 'warn', code: it.code,
          txt: nm + '：现价 ' + fx(q.price, 3) + ' 距止损仅 <b>' + sg(j.dist)
             + '</b>（数据日还有 ' + sg(it.snap_dist) + '）⇒ 今日盯盘'
        });
      }
    });
    return out;
  }

  /* ---------- 7. 今日动作 × 实时价：限价还成不成立 ----------
     计划里写「挂 0.3584」，现价 0.3620，那就还挂得住；
     现价掉到 0.3550 时再挂 0.3584 就是买在高于市价 —— 必须提醒往下挪。 */
  function checkPlan(plan, price) {
    if (!plan || price == null) return null;
    const m = String(plan.limit || '').match(/([0-9]+\.[0-9]+)/);
    if (!m) return null;
    const lim = parseFloat(m[1]);
    const side = plan.side === 'buy' ? 'buy' : 'sell';
    if (side === 'sell') {
      if (price < lim) return { kind: 'warn', txt: '现价 ' + fx(price, 4) + ' 已低于计划限价 ' + fx(lim, 4) + '，卖单要下移到现价附近才成交' };
      return { kind: 'ok', txt: '现价 ' + fx(price, 4) + ' 高于限价 ' + fx(lim, 4) + '，可直接挂单' };
    }
    if (price > lim) return { kind: 'warn', txt: '现价 ' + fx(price, 4) + ' 已高于计划限价 ' + fx(lim, 4) + '，按纪律「不追高」，放弃这一笔' };
    return { kind: 'ok', txt: '现价 ' + fx(price, 4) + ' 低于限价 ' + fx(lim, 4) + '，可挂单' };
  }

  /* ---------- 8. 小工具 ---------- */
  function fx(v, d) { return (v == null || !isFinite(v)) ? '—' : Number(v).toFixed(d == null ? 3 : d); }
  function sg(v, d) { return (v == null || !isFinite(v)) ? '—' : (v >= 0 ? '+' : '') + Number(v).toFixed(d == null ? 2 : d) + '%'; }

  /* ---------- 9. 把 real_positions / 手机页 items 规范成 judge 需要的形状 ---------- */
  function norm(r) {
    return {
      code: r.code, name: r.name, s: r.strategy || r.s, sid: r.sid,
      cost: r.buy_price != null ? r.buy_price : r.cost,
      stop: r.stop != null ? r.stop : null,
      snap_dist: r.dist_stop != null ? r.dist_stop : (r.snap_dist != null ? r.snap_dist : r.dist),
      snap_pnl: r.pnl != null ? r.pnl : r.snap_pnl,
      act: r.act || (r.live_action && r.live_action.action) || null,
      held: r.held_days != null ? r.held_days : r.held,
      prem: r.prem,
      target: r.target
    };
  }

  return {
    SECID: SECID, TXID: TXID,
    fetchEM: fetchEM, fetchTX: fetchTX, fetchQuote: fetchQuote,
    judge: judge, targetOf: targetOf,
    crosscheck: crosscheck, checkPlan: checkPlan, norm: norm,
    RULES: RULES, fx: fx, sg: sg, hhmmss: hhmmss
  };
})();

/* ===== 次方 API 客户端（cf_api.js）— 必须排在 predict_core 之前：
        predict_core 的历史 K 线优先走次方 hist_em，const 有 TDZ，顺序不能反 ===== */
/* ============================================================================
   cf_api.js —— 浏览器端次方量化 API 客户端
   ----------------------------------------------------------------------------
   先纠正一个我自己犯的错：
     上一轮我用 urllib 不带 Origin 头测 CORS，看到没有 ACAO 就断言"次方不支持跨域"，
     还把"CORS 是硬约束"写进了文档。这是错的 —— 浏览器发请求一定会带 Origin，
     服务端也会回显。实测预检响应：

       Access-Control-Allow-Origin:  <回显请求的 Origin，连 null（file://）都放行>
       Access-Control-Allow-Headers: x-api-key          ← 自定义头放行
       Access-Control-Allow-Methods: DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT
       Access-Control-Max-Age:       600

   所以浏览器可以直连，拿到腾讯拿不到的三样东西：
     ① IOPV                → 溢价率（腾讯完全没有这个字段）
     ② 官方持仓与绩效        → /api/strategy/my-running（不用等本机刷新）
     ③ 每天固定时点的历史价  → /api/fund/hist_intraday（14:30 / 14:45，回测就是靠它）

   关于 Key
     它会出现在页面源码里，这是直连的代价，用户已明确授权。
     风险边界：这个账号 trading/list 为空（未开通自动交易），Key 只能读行情，
     最坏情况是别人蹭配额（60 次/分钟限流），不能下单。
   ============================================================================ */
const CF = (function () {
  'use strict';

  const BASE = 'https://www.cifangquant.com/api';
  let KEY = '';
  let STATS = { n: 0, fail: 0, lastErr: '' };

     年化 exp(slope*250)-1，得分 = 年化 × max(R²,0) */
  function wslope(close, n, priceOverride) {
    if (!close || close.length < n) return null;
    const y = close.slice(-n).map(Number);
    if (priceOverride != null) y[n - 1] = priceOverride;   // 用实时价替掉最后一根
    if (y.some(function (v) { return !isFinite(v) || v <= 0; })) return null;

    const x = [], w = [];
    let sw = 0;
    for (let i = 0; i < n; i++) { x.push(i); w.push(Math.pow(1 + i / n, 2)); sw += w[i]; }
    let sxw = 0, syw = 0;
    for (let i = 0; i < n; i++) { sxw += w[i] * x[i]; syw += w[i] * y[i]; }
    const mx = sxw / sw, my = syw / sw;

    let sxx = 0, sxy = 0;
    for (let i = 0; i < n; i++) {
      sxx += w[i] * Math.pow(x[i] - mx, 2);
      sxy += w[i] * (x[i] - mx) * (y[i] - my);
    }
    if (sxx <= 0) return null;
    const slope = sxy / sxx;
    const ann = Math.exp(slope * 250) - 1;

    let ssr = 0, sst = 0;
    for (let i = 0; i < n; i++) {
      const yh = my + slope * (x[i] - mx);
      ssr += w[i] * Math.pow(y[i] - yh, 2);
      sst += w[i] * Math.pow(y[i] - my, 2);

    const px = lv != null ? lv : cl[cl.length - 1];
    const m20 = ma(cl, 20, lv);
    const b20 = m20 ? (px / m20 - 1) * 100 : null;
    const ret = pos.cost ? (px / pos.cost - 1) * 100 : null;
    out.price = px;
    out.b20 = b20 != null ? +b20.toFixed(2) : null;

    if (ret != null) {
      out.gates.push({
        k: '深套止损', th: '−15%', now: ret,
        hit: ret <= -15,
        left: +((ret + 15)).toFixed(2),        // 还要跌多少 pp 才触发
        txt: ret <= -15 ? '已触发，按规则卖出' : ('再跌 ' + Math.abs(ret + 15).toFixed(2) + 'pp 触发'),
        price: pos.cost ? +(pos.cost * 0.85).toFixed(4) : null,
      });
      out.gates.push({
        k: '目标收益', th: '+3%', now: ret,
        hit: ret >= 3,
        left: +(3 - ret).toFixed(2),
        txt: ret >= 3 ? '已触发（还需候选第一不是自己）' : ('再涨 ' + (3 - ret).toFixed(2) + 'pp 触发'),
        price: pos.cost ? +(pos.cost * 1.03).toFixed(4) : null,
      });
    }
    const left = pos.held != null ? Math.max(0, 30 - pos.held) : null;
    out.gates.push({
      k: '到期换仓', th: '30 日', now: pos.held, hit: left === 0,
      left: left,
      txt: left === 0 ? '已满 30 日（还需候选第一不是自己）' : ('还剩 ' + left + ' 个交易日'),
      price: null,
    });

    /* 回本止盈：需要 b20>=0 且 ret>=0，两个条件能算；但「候选第一不是自己」算不了 */
    if (b20 != null && ret != null) {
      out.recover = {
        b20ok: b20 >= 0, retOk: ret >= 0,
        txt: (b20 >= 0 && ret >= 0)
          ? '价格条件已满足（20日乖离 ' + b20.toFixed(2) + '% ≥0、浮盈 ' + ret.toFixed(2) + '%），是否卖取决于候选第一名'
          : '未满足：20日乖离 ' + b20.toFixed(2) + '%（需≥0）、浮盈 ' + ret.toFixed(2) + '%（需≥0）',
      };
    }

    /* 动作：只看「价格能决定」的闸门。−15% 已破就是卖，其它维持 */
    const stopHit = ret != null && ret <= -15;
    out.action = stopHit ? 'sell' : 'hold';
    out.reason = stopHit
      ? ('浮亏 ' + ret.toFixed(2) + '% 已跌破 −15% 深套止损线 ⇒ 按规则卖出，卖出后 3 个交易日不开新仓')
      : ('三道价格闸门均未触发（浮亏 ' + (ret == null ? '—' : ret.toFixed(2) + '%')
         + '，20日乖离 ' + (b20 == null ? '—' : b20.toFixed(2) + '%')
         + '），持有第 ' + (pos.held == null ? '?' : pos.held) + ' 天');
    return out;
  }

  /* ---------- 汇总：一次算完四条 ---------- */
  async function predictAll(live, holds) {
    const t0 = Date.now();
    const tasks = [
      predictMomo(live, (holds.momo96865 || {}).code),
      predictBand(live, (holds.band96863 || {}).code),
      predictBank(live),
      predictDip(live, holds.lineC),
    ];
    const res = await Promise.all(tasks.map(function (p) {
      return p.catch(function (e) { return { ok: false, err: String(e && e.message || e) }; });
    }));
    return {
      at: LC.hhmmss(),
      ms: Date.now() - t0,
      strategies: res.filter(Boolean),
      codes: [...new Set([].concat(
        POOLS.momo96865.codes, POOLS.band96863.codes, POOLS.bank96864.codes,
        holds.lineC ? [holds.lineC.code] : []
      ))],
    };
  }

  return {
    POOLS: POOLS, NAMES: NAMES,
    kline: kline, wslope: wslope, retN: retN, ma: ma,
    predictMomo: predictMomo, predictBand: predictBand,
    predictBank: predictBank, predictDip: predictDip, predictAll: predictAll,
  };
})();

/* ===== 实时评分内核（score_core.js）：市场状态 + 环境判据 + 适配重算 ===== */
/* ============================================================================
 * score_core.js — 浏览器端「实时评分 + 环境判据」引擎
 *
 * 目的：让手机不开电脑就能知道「现在什么天气、这个天气适合哪条策略」。
 * 口径必须与 Python 侧逐位一致，否则评分是假的：
 *   - 指标与四维打分 ← etf_dip_signal/market_state.py（已对次方页面逐位校验）
 *   - 环境分档        ← etf_dip_signal/_sim.py  regime_series()
 *
 * 为什么所有序列都内嵌、不联网：
 *   2026-11-22 实测，三家行情源在 https 发布域下全部不稳定
 *   （腾讯 ifzq 不放行、东财 20 只并发只成 4 只、次方 CORS 抖动）。
 *   评分错一次就是配错仓，不能用会抖的源。
 * ========================================================================== */
const SC = (function () {
  'use strict';

  const REGIME_LABEL = {
    A: '趋势上行·低波', B: '趋势下行·防御有效', Bp: '趋势下行·成长占优',
    C: '震荡·中高波', D: '危机·无差别去杠杆',
  };
  const REGIME_ORDER = ['A', 'C', 'Bp', 'B', 'D'];

  function r(x, n) {
    if (x == null || !isFinite(x)) return null;
    const p = Math.pow(10, n == null ? 4 : n);
    return Math.round(x * p) / p;
  }

  /* ---------- 1. 基础序列运算（对齐 pandas） ---------- */

  function sma(arr, n) {
    const out = new Array(arr.length).fill(null);
    let s = 0;
    for (let i = 0; i < arr.length; i++) {
      s += arr[i];
      if (i >= n) s -= arr[i - n];
      if (i >= n - 1) out[i] = s / n;
    }
    return out;
  }

  /* pandas ewm(span, adjust=False)：y0=x0, yi=(1-a)yi-1 + a·xi, a=2/(span+1) */
  function ewm(arr, span) {
    const a = 2 / (span + 1), out = new Array(arr.length).fill(null);
    let prev = null;
    for (let i = 0; i < arr.length; i++) {
      const x = arr[i];
      if (x == null || !isFinite(x)) { out[i] = prev; continue; }
      prev = (prev == null) ? x : (1 - a) * prev + a * x;
      out[i] = prev;
    }
    return out;
  }

  function diff(arr) {
    return arr.map(function (x, i) { return i ? x - arr[i - 1] : null; });
  }

  /* 简单均值滚动（RSI/ATR 都用它 —— 次方不用 Wilder，实测对不上） */
  function rollMean(arr, n) {
    const out = new Array(arr.length).fill(null);
    for (let i = 0; i < arr.length; i++) {
      if (i < n - 1) continue;
      let s = 0, ok = true;
      for (let j = i - n + 1; j <= i; j++) {
        const v = arr[j];
        if (v == null || !isFinite(v)) { ok = false; break; }
        s += v;
      }
      if (ok) out[i] = s / n;
    }
    return out;
  }

  /* pandas rolling(n).std(ddof=0) —— 总体标准差 */
  function rollStd(arr, n) {
    const out = new Array(arr.length).fill(null);
    for (let i = 0; i < arr.length; i++) {
      if (i < n - 1) continue;
      let s = 0, ok = true;
      for (let j = i - n + 1; j <= i; j++) {
        const v = arr[j];
        if (v == null || !isFinite(v)) { ok = false; break; }
        s += v;
      }
      if (!ok) continue;
      const m = s / n;
      let q = 0;
      for (let j = i - n + 1; j <= i; j++) q += (arr[j] - m) * (arr[j] - m);
      out[i] = Math.sqrt(q / n);
    }
    return out;
  }

  function pctChange(arr, n) {
    return arr.map(function (x, i) {
      return (i < n || arr[i - n] == null || !arr[i - n]) ? null : x / arr[i - n] - 1;
    });
  }

  /* ---------- 2. 指标（对齐 market_state.indicators） ---------- */
  /* ohlcv: [[o,h,l,c,v], ...] 升序 */
  function indicators(ohlcv, dates) {
    const n = ohlcv.length;
    const c = ohlcv.map(function (x) { return +x[3]; });
    const h = ohlcv.map(function (x) { return +x[1]; });
    const l = ohlcv.map(function (x) { return +x[2]; });
    const v = ohlcv.map(function (x) { return +x[4]; });
    const ma = {};
    [5, 10, 20, 60].forEach(function (k) { ma[k] = sma(c, k); });

    const e12 = ewm(c, 12), e26 = ewm(c, 26);
    const dif = e12.map(function (x, i) { return (x == null || e26[i] == null) ? null : x - e26[i]; });
    const dea = ewm(dif, 9);

    const d = diff(c);
    const up = d.map(function (x) { return x == null ? null : Math.max(x, 0); });
    const dn = d.map(function (x) { return x == null ? null : Math.max(-x, 0); });
    const ru = rollMean(up, 14), rd = rollMean(dn, 14);
    const rsi = ru.map(function (x, i) {
      const y = rd[i];
      if (x == null || y == null) return null;
      if (y === 0) return x === 0 ? 50 : 100;
      return 100 - 100 / (1 + x / y);
    });

    const tr = ohlcv.map(function (x, i) {
      const hh = +x[1], ll = +x[2];
      const pc = i ? +ohlcv[i - 1][3] : null;
      const a = hh - ll;
      if (pc == null) return a;
      return Math.max(a, Math.abs(hh - pc), Math.abs(ll - pc));
    });
    const atr = rollMean(tr, 14);

    const mid = ma[20];
    const std = rollStd(c, 20);
    const bw = mid.map(function (m, i) {
      return (m == null || std[i] == null || m === 0) ? null : 4 * std[i] / m;
    });

    const v5 = sma(v, 5), v20 = sma(v, 20);
    const i0 = n - 1;
    const o = {
      date: (dates && dates[i0]) || '',
      close: r(c[i0]),
      chg: (i0 >= 1) ? r((c[i0] / c[i0 - 1] - 1) * 100, 2) : null,
      MA5: r(ma[5][i0]), MA10: r(ma[10][i0]),
      MA20: r(ma[20][i0]), MA60: r(ma[60][i0]),
      DIF: r(dif[i0]), DEA: r(dea[i0]),
      MACD_HIST: r((dif[i0] != null && dea[i0] != null) ? (dif[i0] - dea[i0]) * 2 : null),
      RSI: r(rsi[i0], 2),
      ATR: r(atr[i0]),
      BOLL_bw: r(bw[i0]),
      BOLL_up: r((mid[i0] != null && std[i0] != null) ? mid[i0] + 2 * std[i0] : null),
      BOLL_dn: r((mid[i0] != null && std[i0] != null) ? mid[i0] - 2 * std[i0] : null),
      vol5: r(v5[i0] != null ? v5[i0] / 1e8 : null, 2),
      vol20: r(v20[i0] != null ? v20[i0] / 1e8 : null, 2),
      vol_ratio: r((v5[i0] != null && v20[i0]) ? v5[i0] / v20[i0] : null, 3),
      ret5: (i0 >= 5) ? r((c[i0] / c[i0 - 5] - 1) * 100, 2) : null,
    };
    // ATR 20 日变化：末值 vs 前 20 个 ATR 的均值（对齐 atr.iloc[-21:-1].mean()）
    let pv = 0, pn = 0;
    for (let j = Math.max(0, i0 - 20); j < i0; j++) {
      if (atr[j] != null && isFinite(atr[j])) { pv += atr[j]; pn++; }
    }
    o.ATR_chg = (pn && pv / pn) ? r((atr[i0] / (pv / pn) - 1) * 100, 2) : null;

    /* ---------- 口径之外的观察（不进总分，用来解释「为什么是 0」） ----------
       次方四维只看「水平」，不看「单日强度」和「趋势」：
         量比 1.285 落在 0.7~1.5 就判「正常」→ 0 分，
         但当天可能是 2.2 倍量下跌，这个信号被吃掉了。
       带宽 <0.05 只提示「变盘临近」→ 0 分，但它是近 20 日什么分位，
         用户有权知道。
       这些不改总分（要与次方页面一致），但必须显示出来。 */
    o.vol_mult = (v20[i0] ? r(v[i0] / v20[i0], 2) : null);           // 今日量 / 20日均量
    // 5 日环比
    let a5 = 0, b5 = 0, c5 = 0, d5 = 0;
    for (let j = i0 - 4; j <= i0; j++) { if (isFinite(v[j])) { a5 += v[j]; c5++; } }
    for (let j = i0 - 9; j <= i0 - 5; j++) { if (isFinite(v[j])) { b5 += v[j]; d5++; } }
    o.vol_chg5 = (c5 && d5 && b5) ? r((a5 / c5) / (b5 / d5) * 100 - 100, 1) : null;
    // 成交量 10 日线性斜率（亿股/日）
    const yv = []; for (let j = Math.max(0, i0 - 9); j <= i0; j++) yv.push(v[j] / 1e8);
    let sxy = 0, sx = 0, sy = 0, sxx = 0;
    const nn = yv.length;
    yv.forEach(function (yy, j) { sxy += j * yy; sx += j; sy += yy; sxx += j * j; });
    const den = nn * sxx - sx * sx;
    o.vol_slope = den ? r((nn * sxy - sx * sy) / den, 3) : null;
    // 带宽在近 20 日的分位
    const bws = [];
    for (let j = Math.max(0, i0 - 19); j <= i0; j++) if (bw[j] != null) bws.push(bw[j]);
    if (bws.length > 1) {
      const lastb = bws[bws.length - 1];
      o.bw_pct = r(bws.filter(function (x) { return x < lastb; }).length / bws.length * 100, 0);
      o.bw_min20 = r(Math.min.apply(null, bws));
      o.bw_max20 = r(Math.max.apply(null, bws));
    }
    // 量价组合（单日口径，比 v5/v20 敏感）
    o.vol_combo = '';
    if (o.vol_mult != null && o.chg != null) {
      if (o.vol_mult > 1.5) o.vol_combo = o.chg >= 0 ? '放量上涨' : '放量下跌';
      else if (o.vol_mult < 0.7) o.vol_combo = o.chg >= 0 ? '缩量上涨' : '缩量下跌';
      else o.vol_combo = '量能平稳';
    }
    return o;
  }

  /* ---------- 3. 四维打分（对齐 market_state.score） ---------- */
  function mktScore(o) {
    const m5 = o.MA5, m10 = o.MA10, m20 = o.MA20, m60 = o.MA60;
    let t, tLab;
    const bull = m5 > m10 && m10 > m20 && (m60 == null || m20 > m60);
    const bear = m5 < m10 && m10 < m20 && (m60 == null || m20 < m60);
    if (bull) { t = 100; tLab = '完全多头'; }
    else if (bear) { t = -100; tLab = '完全空头'; }
    else if (m5 > m10 && m10 <= m20) { t = 50; tLab = '部分多头（短期拐头）'; }
    else if (m5 < m10 && m10 >= m20) { t = -50; tLab = '部分空头（短期拐头）'; }
    else { t = 0; tLab = '纠缠'; }

    const dif = o.DIF, dea = o.DEA, rsi = o.RSI;
    let mc, mcLab;
    if (dif > dea && dif > 0) { mc = 100; mcLab = '强势金叉'; }
    else if (dif > dea) { mc = 50; mcLab = '弱势金叉'; }
    else if (dif < dea && dif < 0) { mc = -100; mcLab = '强势死叉'; }
    else { mc = -50; mcLab = '弱势死叉'; }
    let rs, rsLab;
    if (rsi >= 70) { rs = 100; rsLab = '超买'; }
    else if (rsi <= 30) { rs = -100; rsLab = '超卖'; }
    else { rs = 0; rsLab = '正常'; }
    const mom = 0.5 * mc + 0.5 * rs;

    const ac = o.ATR_chg;
    let at, atLab;
    if (ac == null) { at = 0; atLab = '无数据'; }
    else if (ac > 20) { at = -100; atLab = '波动率快速上升'; }
    else if (ac < -20) { at = 50; atLab = '波动率收敛'; }
    else { at = 0; atLab = '波动率正常'; }
    const bw = o.BOLL_bw;
    let bt, btLab;
    if (bw > 0.15) { bt = 100; btLab = '趋势强劲'; }
    else if (bw < 0.05) { bt = 0; btLab = '极窄·等待方向'; }
    else { bt = 0; btLab = '正常'; }
    const vol = 0.5 * at + 0.5 * bt;

    const vr = o.vol_ratio, r5 = o.ret5;
    let vt, vtLab;
    if (vr == null) { vt = 0; vtLab = '无数据'; }
    else if (vr > 1.5) { vt = (r5 != null && r5 >= 0) ? 100 : -100; vtLab = (r5 >= 0) ? '放量上涨' : '放量下跌'; }
    else if (vr < 0.7) { vt = (r5 != null && r5 >= 0) ? 30 : -30; vtLab = (r5 >= 0) ? '缩量上涨' : '缩量下跌'; }
    else { vt = 0; vtLab = '量能正常'; }

    const total = 0.40 * t + 0.30 * mom + 0.15 * vol + 0.15 * vt;
    let state;
    if (total > 30) state = '牛市';
    else if (total < -30) state = '熊市';
    else state = '震荡市';
    const conf = Math.min(Math.abs(total) / 100, 1);

    return {
      total: r(total, 1), state: state, conf: r(conf * 100, 1),
      conf_note: conf < 0.3 ? '判断不可靠，方向并不明确'
        : (conf > 0.7 ? '可以当作重要参考' : '中等强度，需结合其他证据'),
      squeeze: !!(bw < 0.05),
      dims: [
        { k: '趋势', w: 40, v: r(t, 1), label: tLab,
          why: 'MA5 ' + o.MA5 + ' / MA10 ' + o.MA10 + ' / MA20 ' + o.MA20
            + (o.MA60 == null ? '' : ' / MA60 ' + o.MA60)
            + ' ⇒ ' + tLab + ' ' + (t > 0 ? '+' : '') + t,
          detail: 'MA5 ' + o.MA5 + ' ｜ MA10 ' + o.MA10 + ' ｜ MA20 ' + o.MA20
            + (o.MA60 == null ? '' : ' ｜ MA60 ' + o.MA60) },
        { k: '动量', w: 30, v: r(mom, 1), label: mcLab + ' / RSI ' + rsLab,
          why: 'DIF ' + o.DIF + (dif > dea ? ' ≥ ' : ' < ') + 'DEA ' + o.DEA
            + ' ⇒ ' + mcLab + ' ' + (mc > 0 ? '+' : '') + mc
            + '；RSI ' + o.RSI + (rsi >= 70 ? ' ≥70 超买' : (rsi <= 30 ? ' ≤30 超卖' : ' 在 30~70 正常'))
            + ' ' + (rs > 0 ? '+' : '') + rs
            + ' ⇒ 各取一半 = ' + (mom > 0 ? '+' : '') + r(mom, 1),
          detail: 'DIF ' + o.DIF + (dif > dea ? ' > ' : ' < ') + 'DEA ' + o.DEA + ' ｜ RSI ' + o.RSI },
        { k: '波动率', w: 15, v: r(vol, 1), label: atLab + ' / ' + btLab,
          why: 'ATR 20日变化 ' + (o.ATR_chg > 0 ? '+' : '') + o.ATR_chg + '%'
            + (ac == null ? '（无数据）' : (ac > 20 ? ' >+20% 波动骤升 −100'
              : (ac < -20 ? ' <−20% 波动收敛 +50' : ' 在 ±20% 内 0')))
            + '；布林带宽 ' + o.BOLL_bw
            + (bw > 0.15 ? ' >0.15 趋势强劲 +100'
              : (bw < 0.05 ? ' <0.05 极窄（口径只提示、不加分）0' : ' 在 0.05~0.15 正常 0'))
            + ' ⇒ 各取一半 = ' + (vol > 0 ? '+' : '') + r(vol, 1)
            + (o.bw_pct != null ? '。带宽在近 20 日分位 ' + o.bw_pct + '%' : ''),
          detail: 'ATR ' + o.ATR + '（20日变化 ' + (o.ATR_chg > 0 ? '+' : '') + o.ATR_chg + '%）｜ 带宽 ' + o.BOLL_bw },
        { k: '成交量', w: 15, v: r(vt, 1), label: vtLab,
          why: '量比（5日/20日）' + vr + (vr == null ? '（无数据）'
            : (vr > 1.5 ? ' >1.5 放量' : (vr < 0.7 ? ' <0.7 缩量' : ' 在 0.7~1.5 正常 0')))
            + (vr != null && vr <= 1.5 && vr >= 0.7
              ? '。注意：本口径只看均量水平，不看单日强度 —— 今日单日 '
                + o.vol_mult + ' 倍量、' + o.vol_combo + '，这层不在四维里'
              : '')
            + ' ⇒ ' + (vt > 0 ? '+' : '') + r(vt, 1),
          detail: '5日均量 ' + o.vol5 + ' 亿股 / 20日均量 ' + o.vol20 + ' 亿股 ⇒ 量比 ' + vr },
      ],
    };
  }

  /* ---------- 4. 环境判据（对齐 _sim.regime_series） ----------
     判定树（顺序即优先级）：
       below = 沪深300 < MA200
       D  : below 且 创业板波动分位 ≥85% 且 红利20日 < −5%
       B  : below 且 成长(创业板) − 红利 20日差 < 0
       B' : below
       A  : 未破 MA200 且 波动分位 < 50%
       C  : 其余
     注意「红利」用的是 510880，不是持仓里的 515450 —— 前者是判据标的。
  */
  function volPct(vols, win, minp) {
    const v = vols.filter(function (x) { return x != null && isFinite(x); });
    if (v.length < (minp || 250)) return null;
    const a = v.slice(-(win || 750));
    const last = a[a.length - 1];

  function regime(sd) {

    else if (below && gmd < 0) code = 'B';
    else if (below) code = 'Bp';
    else if (vp < 0.50) code = 'A';
    else code = 'C';

    const ma200d = sma(D, 200);
    const dDev = (ma200d[i0] == null) ? null : D[i0] / ma200d[i0] - 1;

    /* 每条判据都要能回答「它达标了没、为什么没有/有」——
       只显示一个没打勾的点，会被误读成「没有数据」。 */
    const volOk = vp >= 0.85;
    const dvOk = r20d < -0.05;
    const noteVol = (vp == null) ? '样本不足 250 个观测，算不出分位'
      : (volOk && dvOk ? '两项都满足 ⇒ 触发 D'
        : (volOk ? ('波动 ' + (vp * 100).toFixed(1) + '% 已 ≥85% 达标，'
                   + '但红利 20 日 ' + (r20d > 0 ? '+' : '') + (r20d * 100).toFixed(2)
                   + '% 未跌破 −5% ⇒ 不判 D')
          : ('波动 ' + (vp * 100).toFixed(1) + '% 未达 85% 门槛'
             + (dvOk ? '（红利已跌 ' + (r20d * 100).toFixed(2) + '%，只差波动这一项）' : ''))));

    return {
      ok: true, code: code, label: REGIME_LABEL[code] || '',
      items: [
        { k: '沪深300 距 MA200', v: r(dev * 100, 2), unit: '%', hit: below,
          th: '< 0 ⇒ 趋势向下（第一层：决定上行/下行）',

  }

  /* ---------- 5. 策略适配：按当前 regime 列查矩阵 ---------- */
  /* matrix = hub.regime_matrix {regimes:[{k,label,n}], rows:[{id,name,cells:[{mean_bp,win,n}]}]} */
  function adapt(matrix, code) {
    if (!matrix || !matrix.regimes || !matrix.rows) return [];
    const idx = matrix.regimes.findIndex(function (x) { return x.k === code; });
    if (idx < 0) return [];
    const out = matrix.rows.map(function (row) {
      const c = row.cells[idx];
      return {
        id: row.id, name: row.name,
        bp: c ? c.mean_bp : null, win: c ? c.win : null, n: c ? c.n : null,
      };
    }).filter(function (x) { return x.bp != null; });
    out.sort(function (a, b) { return b.bp - a.bp; });
    return out;
  }

  /* ---------- 6. 实时评分：静态基线 + 随 regime 变的「环境适配」 ----------
     score_strategy 里唯一会随行情变的是「当前环境适配 18 分」：
        v = 18 × (0.6·rank(bp) + 0.4·rank(win))，rank 为四条策略间的 pct 排名。
     其余八维是历史统计与静态属性，不因今天涨跌而变（写死在内嵌基线里）。
     所以这里只重算那一维，并把差额加到总分上 —— 不虚构会变的东西。
  */
  function pctRank(vals) {
    const idx = vals.map(function (v, i) { return { v: v, i: i }; })
      .sort(function (a, b) { return a.v - b.v; });
    const out = new Array(vals.length).fill(0.5);
    idx.forEach(function (o, k) { out[o.i] = (k + 1) / vals.length; });
    return out;
  }

  function rescore(strategies, matrix, code) {
    const ad = adapt(matrix, code);
    if (!ad.length) return [];
    const map = {};

    const ids = ad.map(function (x) { return x.id; });
    const rb = pctRank(ad.map(function (x) { return x.bp; }));
    const rw = pctRank(ad.map(function (x) { return x.win == null ? 0 : x.win; }));

    return strategies.map(function (s) {
      const a = map[s.id];
      if (!a) return null;
      const k = ids.indexOf(s.id);
      const regRank = 0.6 * rb[k] + 0.4 * rw[k];
      const newDim = 18 * regRank;
      // 找基线里的「环境适配」项
      const items = (s.score && s.score.items) ? s.score.items : [];
      const oldDim = (items.find(function (x) { return x.k === '当前环境适配'; }) || {}).v;
      const base = (s.score && s.score.total) || 0;
      const total = oldDim == null ? base : base - oldDim + newDim;

        id: s.id, name: s.name, rank: null,
        bp: a.bp, win: a.win, n: a.n,
        regRank: regRank, regDim: r(newDim, 1), regDimOld: oldDim,
        total: r(total, 1), base: base,
        delta: oldDim == null ? null : r(newDim - oldDim, 1),
        // 该策略在这个 regime 下历史日均 bp 的横截面名次
        rankInRegime: k + 1, nStrategies: ad.length,
      };
    }).filter(Boolean).sort(function (a, b) { return b.total - a.total; });
  }

  /* ---------- 6.5 多市场广度 ----------
     用户批评得对：只看 510300 的均线排列，会被单一标的骗线。
     真正的「大盘怎么样」要看多个市场同时有多少在涨 —— 这是我们原来缺的一层。

     做两件事：
       breadth   ：跨市场标的里，20 日涨幅 > 0 的占比（市场广度）
       riskOn    ：风险资产（纳指/创业板/油气）vs 避险（黄金/红利）的 20 日相对强弱
     两个都用 close 序列，不需要 OHLCV，所以成本很低。
  */
  const RISK_ASSETS = ['513100', '159509', '159915', '162411'];
  const SAFE_ASSETS = ['518880', '510880'];
  const BREADTH_CORE = ['510300', '159915', '159920', '513100',
                        '513030', '513520', '518880', '162411'];

  function r20Of(arr) {
    if (!arr || arr.length < 21) return null;
    const a = arr[arr.length - 1], b = arr[arr.length - 21];
    return (b && isFinite(b)) ? (a / b - 1) * 100 : null;
  }

  function breadth(closeMap) {
    const items = [];
    BREADTH_CORE.forEach(function (c) {
      const v = r20Of((closeMap || {})[c]);
      if (v == null) return;
      items.push({ code: c, r20: r(v, 2), up: v > 0 });
    });
    if (!items.length) return null;
    const up = items.filter(function (x) { return x.up; }).length;
    return {
      n: items.length, up: up, down: items.length - up,
      pct: r(up / items.length * 100, 0),
      items: items,
    };
  }

  function riskOn(closeMap) {
    const avg = function (codes) {
      const v = [];
      codes.forEach(function (c) {
        const x = r20Of((closeMap || {})[c]);
        if (x != null) v.push(x);
      });
      return v.length ? v.reduce(function (a, b) { return a + b; }, 0) / v.length : null;
    };
    const a = avg(RISK_ASSETS), b = avg(SAFE_ASSETS);
    if (a == null || b == null) return null;
    const gap = a - b;
    return {
      risk: r(a, 2), safe: r(b, 2), gap: r(gap, 2),
      state: gap > 2 ? '风险偏好回升' : (gap < -2 ? '避险占优' : '中性'),
      // 用 0 轴分档：>5pp 强 risk-on，<-5pp 强 risk-off
      tier: gap > 5 ? 2 : (gap > 2 ? 1 : (gap < -5 ? -2 : (gap < -2 ? -1 : 0))),
    };
  }

  /* ---------- 7. 用实时价补今日 bar ----------
     内嵌序列的最后一天是数据日。若现在是交易日且行情时间晚于数据日，
     就用实时价追加一根（成交量缺失 → 用近 5 日均量代替，只影响量比一维）。
     非交易日/盘前不动 —— 宁可不更新，也不要编一根假 K 线。
  */
  function applyLive(sd, live, nowStr) {
    if (!sd || !sd.close || !live) return { sd: sd, applied: false, why: '无数据' };
    const today = nowStr || new Date().toISOString().slice(0, 10);
    const d = new Date();
    const wd = d.getDay();
    if (wd === 0 || wd === 6) return { sd: sd, applied: false, why: '周末非交易日' };
    if (sd.date >= today) return { sd: sd, applied: false, why: '数据日即今日' };

    const out = { close: {}, ohlcv: {}, dates: (sd.dates || []).slice(), date: today };
    Object.keys(sd.close).forEach(function (c) {
      const arr = sd.close[c].slice();
      const q = live[c];
      arr.push((q && q.price) ? +q.price : arr[arr.length - 1]);
      out.close[c] = arr;
    });
    Object.keys(sd.ohlcv || {}).forEach(function (c) {
      const arr = sd.ohlcv[c].map(function (x) { return x.slice(); });
      const q = live[c];
      if (q && q.price) {

                  +q.price, Math.round(av)]);
      }
      out.ohlcv[c] = arr;
    });
    out.dates.push(today);
    return { sd: out, applied: true, why: '已用实时价补 ' + today };
  }

  function marketState(sd) {
    const o = (sd && sd.ohlcv) || {};

    Object.keys(o).forEach(function (c) {

      try {
        const ind = indicators(o[c], sd.dates);
        out[c] = { ind: ind, score: mktScore(ind) };
      } catch (e) { /* 单只算错不影响其它 */ }
    });
    return out;
  }

  return {
    indicators: indicators, mktScore: mktScore, regime: regime,
    adapt: adapt, rescore: rescore, applyLive: applyLive,
    marketState: marketState, volPct: volPct,
    breadth: breadth, riskOn: riskOn,
    REGIME_LABEL: REGIME_LABEL, REGIME_ORDER: REGIME_ORDER,
    BREADTH_CORE: BREADTH_CORE,
  };

function cardHTML(x, isExtra){
  const p = LIVE[x.code] || {};
  const price = p.price != null ? p.price : x.last;
  const chg = p.chg;
  const cost = x.cost, stop = x.stop;
  const j = LC.judge(LC.norm(x), price);          /* ← 与主看台同一个判定函数 */
  const pnl = j.pnl != null ? j.pnl : x.pnl;
  const dist = j.dist != null ? j.dist : x.dist;
  const act = x.act || 'hold';
  const plan = x.plan;
  const pc = plan ? LC.checkPlan(plan, price) : null;

  // 尺度条：止损 / 成本 / 现价 三档刻度；只给「现价」加文字，避免标签互相压住
  let bar = '';
  if (stop != null && cost != null && price != null) {
    const lo = Math.min(stop, cost, price) * 0.996;
    const hi = Math.max(stop, cost, price) * 1.004;
    const P = v => Math.max(9, Math.min(91, (v - lo) / (hi - lo) * 100));
    const below = price < stop;
    bar = `<div class="bar"><div class="line"></div>
      <div class="mk t s" style="left:${P(stop).toFixed(1)}%"><i></i></div>
      <div class="mk t c" style="left:${P(cost).toFixed(1)}%"><i></i></div>
      <div class="mk cur ${below ? 'bad' : ''}" style="left:${P(price).toFixed(1)}%">${fmt(price, 3)}<i></i></div>
    </div>
    <div class="lg">止损 ${fmt(stop, 3)}（较紧那条）· 成本 ${fmt(cost, 3)}${below ? ' · <b style="color:#059669">已跌破</b>' : ''}</div>`;
  }

  // 判定徽章：只在不是「安全」时出现，避免满屏提示；带 data-g 供 15s 刷新时原地更新
  const showG = stop != null && j.gate !== 'ok' && j.gate !== 'na';
  const gate = stop != null
    ? `<span class="chip" data-g="${x.code}" style="display:${showG ? 'inline-block' : 'none'};background:${GC[j.gate]}12;color:${GC[j.gate]};border:1px solid ${GC[j.gate]}55">${j.txt}</span>`
    : '';

  // ---- 依据区 ----
  let more = '';
  if (plan) {
    more += `<div class="m-sec">今日指令</div>
      <div class="plan">
        <div class="h">${plan.side === 'sell' ? '卖出' : '买入'} ${x.code}${plan.shares ? ' · ' + plan.shares.toLocaleString('zh-CN') + ' 份' : ''}</div>
        <div class="r">
          参考价 <b>${fmt(plan.ref, 4)}</b> · ${plan.when || ''}<br>
          限价：${plan.limit || '—'}<br>
          ${plan.why ? '为什么：' + plan.why + '<br>' : ''}
          ${plan.after ? '执行后：' + plan.after : ''}
        </div>
        ${pc ? `<div class="r" style="margin-top:6px;color:${pc.kind === 'warn' ? '#b54708' : '#047857'}">
          ▸ ${pc.txt}</div>` : ''}
      </div>`;
  }
  if (x.act_reason) {
    more += `<div class="m-sec">今日判定依据</div>
      <div class="m-row"><div class="k">理由</div><div class="v">${esc(x.act_reason)}</div></div>`;
  }
  if (x.next) {
    more += `<div class="m-row"><div class="k">下一步</div><div class="v">${esc(x.next)}</div></div>`;
  }
  const rule = (LC.RULES[x.sid] || {}).note;
  if (rule) {
    more += `<div class="m-sec">这条策略的风控口径</div>
      <div class="m-row"><div class="k">规则</div><div class="v">${esc(rule)}</div></div>`;
  }
  if (x.stop_note) {
    more += `<div class="m-row"><div class="k">止损</div><div class="v">${esc(x.stop_note)}</div></div>`;
  }
  if (x.prem != null && Math.abs(x.prem) >= 2) {
    const hi = x.prem > 5;
    more += `<div class="m-row"><div class="k">溢价</div>
      <div class="v" style="color:${hi ? '#b91c1c' : '#475569'}">${sgn(x.prem)}${hi ? ' ← 超过 5%，实盘买入即接溢价' : ''}</div></div>`;
  }
  const sc = x.score;
  if (sc && sc.total != null) {
    const barOf = arr => arr.map(t => {
      const r = t.max ? t.v / t.max : 0;
      return `<i class="${r >= 0.7 ? 'g' : ''}" title="${t.k} ${t.v}/${t.max}"></i>`;
    }).join('');
    more += `<div class="m-sec">九维评分 ${sc.total} / ${sc.max}${
      sc.rk === false ? '　<b style="color:#b54708">不可排名（' + esc((sc.why || []).join(' / ')) + '）</b>' : ''
    }</div>
      <div class="sbar">${barOf(sc.top.concat(sc.weak).slice(0, 5))}</div>
      <div class="m-row" style="margin-top:5px"><div class="k">强项</div>
        <div class="v">${sc.top.map(t => t.k + ' ' + t.v + '/' + t.max).join('　')}</div></div>
      <div class="m-row"><div class="k">短板</div>
        <div class="v" style="color:#b54708">${sc.weak.map(t => t.k + ' ' + t.v + '/' + t.max).join('　')}</div></div>`;
  }

  /* 行业占位：把「行业内部强弱」接到这笔持仓上。
     没有这一行，行业强弱就是一张孤立的表；有了它，亏损能立刻分清
     「个股/ETF 自己的问题」还是「整个行业都在退潮」。 */
  const ig = (D.indMap || {})[x.code];
  if (ig) {
    more += `<div class="m-sec">行业内部强弱</div>
      <div class="m-row"><div class="k">${esc(ig.k)}</div>
        <div class="v">广度 ${ig.br}% · ${esc(ig.st)}</div></div>`;
  }

  const focus = FOCUS && FOCUS === x.sid;

  return `<div class="card${focus ? ' focus' : ''}" data-code="${x.code}">
    <div class="top">
      <span class="st">${x.s || ''}</span>
      ${!isExtra ? `<span class="chip ${act}">${({hold:'持有',sell:'卖出',buy:'买入',empty:'空仓'})[act] || '—'}</span>` : ''}
      ${gate}
      ${x.badge ? `<span class="badge ${x.badge === '线上' ? 'live' : ''}">${x.badge}</span>` : ''}
      ${x.fb ? '<span class="badge fb">默认腿</span>' : ''}
      ${(x.also && x.also.length) ? `<span class="badge fb">${esc(x.also.map(a => String(a).replace(/^momo·/, '')).join(' / '))} 同持</span>` : ''}
      <span class="det-link" onclick="openStrat('${x.sid}')">详情 →</span>
    </div>
    <div class="price">
      <span class="nm">${x.code} ${x.name || ''}</span>
      <span class="p ${chg == null ? '' : cls(chg)}" data-p="${x.code}">${fmt(price, 3)}</span>
      <span class="c ${chg == null ? 'fl' : cls(chg)}" data-c="${x.code}">${chg == null ? '—' : sgn(chg)}</span>
    </div>
    <div class="grid">
      <div><div class="k">浮动盈亏</div>
        <div class="v ${cls(pnl)}" data-pnl="${x.code}">${pnl == null ? '—' : sgn(pnl)}</div></div>
      <div><div class="k">距止损</div>
        <div class="v" style="color:${GC[j.gate]}" data-dist="${x.code}">${
          dist == null ? '<span style="font-size:11.5px;opacity:.65;font-weight:600">无止损</span>' : sgn(dist)}</div></div>
      <div><div class="k">持有</div>
        <div class="v">${x.held == null ? '—' : x.held + ' 日'}</div></div>
    </div>
    ${bar}
    ${more ? `<div class="tog">依据与今日指令<i>▾</i></div><div class="more">${more}</div>` : ''}
  </div>`;
}

function bindCards(){
  document.querySelectorAll('.card').forEach(c => {
    if (OPEN.has(c.dataset.code)) c.classList.add('open');

      c.classList.toggle('open');

      else OPEN.delete(c.dataset.code);
